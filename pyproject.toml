[project]
name = "civic-records-agent"
version = "0.1.0"
description = "Local-first research agent over Downey and El Segundo city council records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "structlog>=24.1",
]

# Dependencies are added in the phase that first imports them, so the lockfile
# always reflects what the code actually uses.

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
civic = "civic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
